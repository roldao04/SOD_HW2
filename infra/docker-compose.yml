services:
  # MinIO - S3-compatible object storage for data lake
  minio:
    image: minio/minio:latest
    container_name: sod-minio
    ports:
      - "9000:9000"  # API port
      - "9001:9001"  # Console UI port
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - sod-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO Client - Initialize buckets on startup
  minio-init:
    image: minio/mc:latest
    container_name: sod-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      /usr/bin/mc mb myminio/bronze --ignore-existing;
      /usr/bin/mc mb myminio/silver --ignore-existing;
      /usr/bin/mc mb myminio/gold --ignore-existing;
      /usr/bin/mc anonymous set download myminio/bronze;
      /usr/bin/mc anonymous set download myminio/silver;
      /usr/bin/mc anonymous set download myminio/gold;
      echo 'Buckets created successfully';
      exit 0;
      "
    networks:
      - sod-network

  # Dremio - Distributed SQL query engine
  dremio:
    image: dremio/dremio-oss:latest
    container_name: sod-dremio
    ports:
      - "9047:9047"  # Web UI
      - "31010:31010"  # ODBC/JDBC
      - "32010:32010"  # Arrow Flight
    environment:
      DREMIO_JAVA_SERVER_EXTRA_OPTS: "-Xmx4g -XX:MaxDirectMemorySize=4g"
    volumes:
      - dremio_data:/opt/dremio/data
    networks:
      - sod-network
    depends_on:
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9047"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # NLP Chatbot API - Natural language query interface
  chatbot-api:
    build:
      context: ..
      dockerfile: infra/dockerfile/chatbot-api/Dockerfile
    container_name: sod-chatbot-api
    ports:
      - "8000:8000"  # FastAPI server
    env_file:
      - .env
    environment:
      # Override for internal Docker network
      DREMIO_HOST: dremio
    volumes:
      # Mount source code for development
      - ../src:/app/src:ro
    networks:
      - sod-network
    depends_on:
      dremio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s  # Gemini API initialization is fast
    restart: unless-stopped

networks:
  sod-network:
    driver: bridge

volumes:
  minio_data:
    driver: local
  dremio_data:
    driver: local
